{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Catálogo de Videojuegos</h2>
<div class="row">
    {% for juego in videojuegos %}
    <div class="col-md-4 mb-3">
        <div class="card h-100">
            <div class="card-body">
                <span class="badge bg-primary mb-2">{{ juego.genero.nombre }}</span>
                <h5 class="card-title">{{ juego.titulo }}</h5>
                <p class="card-text">Precio: ${{ juego.precio }}</p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <a href="{% url 'videojuego_detail' juego.pk %}" class="btn btn-info btn-sm">Ver</a>
                <a href="{% url 'videojuego_update' juego.pk %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'videojuego_delete' juego.pk %}" class="btn btn-danger btn-sm">Eliminar</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

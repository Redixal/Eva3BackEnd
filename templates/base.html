{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Hito 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/custom.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'videojuego_list' %}">
                <img src="{% static 'core/logo.png' %}" alt="Logo Institucional" height="30" class="me-2 rounded bg-white p-1">
                <span class="fw-bold">Virtual Days Online Store</span>
            </a>

            <div>
                {% if user.is_authenticated %}
                    <span class="text-white me-3 small">Hola, <b>{{ user.username }}</b></span>
                    <a class="btn btn-success btn-sm me-2" href="{% url 'videojuego_create' %}">+ Nuevo Registro</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Iniciar Sesión</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
